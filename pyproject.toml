[project]
name = "resas-automate"
version = "0.1.0"
description = "米沢市／置賜の滞在人口・From-to・宿泊者数CSVを公的オープンデータから生成する"
requires-python = ">=3.10"
dependencies = []          # 標準ライブラリのみで動作する

[project.scripts]
resas-automate = "resas_automate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
